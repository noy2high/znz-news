<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZNZ | XAUUSD Bar Replay Engine</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        znz: {
                            bg: '#050507',
                            sidebar: '#0A0B0E',
                            card: '#0D0F17',
                            border: 'rgba(255, 255, 255, 0.08)',
                            purple: '#6366F1',
                            green: '#10B981',
                            red: '#EF4444',
                            muted: '#8E95A5'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lightweight Charts Standalone CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #050507;
            color: #F3F4F6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #main-viewport {
            position: absolute;
            top: 64px;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
        }

        #drawing-toolbar {
            width: 48px;
            background: #0A0B0E;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 12px;
            z-index: 30;
            position: relative;
        }

        #chart-container {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #drawing-svg-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .tool-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8E95A5;
            transition: all 0.2s ease;
            position: relative;
        }
        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }
        .tool-btn.active {
            background: rgba(99, 102, 241, 0.2);
            color: #6366F1;
            border: 1px solid rgba(99, 102, 241, 0.4);
        }

        .tf-btn {
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            color: #8E95A5;
            transition: all 0.2s;
        }
        .tf-btn:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.05);
        }
        .tf-btn.active {
            color: #FFFFFF;
            background: rgba(99, 102, 241, 0.25);
            border: 1px solid rgba(99, 102, 241, 0.4);
        }

        /* TradingView Style Lines Popup Menu */
        #lines-menu {
            position: absolute;
            top: 12px;
            left: 56px;
            width: 230px;
            background: #13151D;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
            padding: 8px 0;
            z-index: 50;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #D1D5DB;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .menu-item:hover {
            background: rgba(99, 102, 241, 0.15);
            color: #FFFFFF;
        }
        .menu-item.active {
            color: #6366F1;
            font-weight: 700;
            background: rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body class="flex flex-col bg-znz-bg relative">

    <!-- Top Navigation & Replay Controller Bar -->
    <header class="h-16 border-b border-znz-border px-4 sm:px-6 flex items-center justify-between bg-znz-sidebar flex-shrink-0 z-30">
        
        <!-- Left: Back Button & Symbol Title -->
        <div class="flex items-center gap-3 sm:gap-4">
            <a href="/" class="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-znz-muted hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="font-extrabold text-white text-sm sm:text-base">XAU / USD</h1>
                    <span class="bg-amber-500/20 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded border border-amber-500/30">REPLAY MODE</span>
                </div>
                <p id="candle-time-display" class="text-[11px] text-znz-muted">Initializing chart engine...</p>
            </div>
        </div>

        <!-- Timeframe Selectors (1m to 1M) -->
        <div class="hidden xl:flex items-center gap-1 bg-black/50 p-1 rounded-xl border border-znz-border">
            <button onclick="changeTimeframe('1m')" id="tf-1m" class="tf-btn">1m</button>
            <button onclick="changeTimeframe('5m')" id="tf-5m" class="tf-btn">5m</button>
            <button onclick="changeTimeframe('15m')" id="tf-15m" class="tf-btn active">15m</button>
            <button onclick="changeTimeframe('1h')" id="tf-1h" class="tf-btn">1h</button>
            <button onclick="changeTimeframe('4h')" id="tf-4h" class="tf-btn">4h</button>
            <button onclick="changeTimeframe('1d')" id="tf-1D" class="tf-btn">1D</button>
            <button onclick="changeTimeframe('1w')" id="tf-1W" class="tf-btn">1W</button>
            <button onclick="changeTimeframe('1M')" id="tf-1M" class="tf-btn">1M</button>
        </div>

        <!-- Center: Replay Controls -->
        <div class="flex items-center gap-1.5 sm:gap-2 bg-black/60 p-1.5 rounded-xl border border-znz-border">
            <input type="date" id="replay-date" class="bg-znz-card text-xs text-white px-2 py-1.5 rounded-lg border border-znz-border focus:outline-none focus:border-znz-purple">

            <button onclick="jumpToCutDate()" class="px-2.5 sm:px-3 py-1.5 bg-znz-purple hover:bg-indigo-600 text-white font-bold text-xs rounded-lg transition">
                Cut
            </button>

            <div class="h-4 w-px bg-znz-border mx-0.5 sm:mx-1"></div>

            <button id="btn-play" onclick="togglePlay()" class="p-1.5 sm:p-2 rounded-lg bg-znz-green/20 hover:bg-znz-green/30 text-znz-green transition">
                <svg id="icon-play" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <button onclick="stepForward()" class="p-1.5 sm:p-2 rounded-lg bg-white/5 hover:bg-white/10 text-white transition">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>

            <select id="replay-speed" onchange="changeSpeed()" class="bg-znz-card text-xs text-white px-1.5 py-1.5 rounded-lg border border-znz-border focus:outline-none">
                <option value="1000">1s</option>
                <option value="500" selected>0.5s</option>
                <option value="200">0.2s</option>
            </select>
        </div>

        <!-- Right: Current Price Indicator -->
        <div class="hidden lg:flex items-center gap-2">
            <span class="text-xs text-znz-muted font-medium">Replay Price:</span>
            <span id="replay-price" class="text-base font-extrabold text-white tracking-tight">$0.00</span>
        </div>
    </header>

    <!-- Main Viewport -->
    <div id="main-viewport">
        
        <!-- Left Tools Bar -->
        <div id="drawing-toolbar">
            <!-- Cursor / Pan Tool -->
            <button id="tool-cursor" onclick="selectTool('cursor')" class="tool-btn active" title="Cursor / Pan">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"></path></svg>
            </button>

            <!-- Lines Category Trigger -->
            <button id="tool-lines-category" onclick="toggleLinesMenu(event)" class="tool-btn" title="Lines Category">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 19L20 5"></path></svg>
            </button>

            <div class="w-6 h-px bg-znz-border my-1"></div>

            <!-- Clear All Drawings -->
            <button onclick="clearDrawings()" class="tool-btn hover:text-znz-red" title="Clear All Drawings">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>

            <!-- Pop-up Lines Category Menu -->
            <div id="lines-menu" class="hidden">
                <div class="px-4 py-1 text-[10px] font-bold text-znz-muted uppercase tracking-wider">LINES</div>
                
                <div onclick="setLineTool('trendline')" class="menu-item" id="item-trendline">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 19L20 5"/></svg>
                        Trendline
                    </span>
                    <span class="text-[10px] text-znz-muted">Alt + T</span>
                </div>

                <div onclick="setLineTool('ray')" class="menu-item" id="item-ray">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 19L20 5M20 5h-6M20 5v6"/></svg>
                        Ray
                    </span>
                </div>

                <div onclick="setLineTool('infoline')" class="menu-item" id="item-infoline">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 19L20 5M12 8h4v4h-4z"/></svg>
                        Info line
                    </span>
                </div>

                <div onclick="setLineTool('extendedline')" class="menu-item" id="item-extendedline">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 21L22 3"/></svg>
                        Extended line
                    </span>
                </div>

                <div onclick="setLineTool('trendangle')" class="menu-item" id="item-trendangle">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 19h16M4 19L16 7"/></svg>
                        Trend angle
                    </span>
                </div>

                <div onclick="setLineTool('hline')" class="menu-item" id="item-hline">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12h16"/></svg>
                        Horizontal line
                    </span>
                    <span class="text-[10px] text-znz-muted">Alt + H</span>
                </div>

                <div onclick="setLineTool('hray')" class="menu-item" id="item-hray">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12h8M12 12a2 2 0 100-4 2 2 0 000 4z"/></svg>
                        Horizontal ray
                    </span>
                    <span class="text-[10px] text-znz-muted">Alt + J</span>
                </div>

                <div onclick="setLineTool('vline')" class="menu-item" id="item-vline">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16"/></svg>
                        Vertical line
                    </span>
                    <span class="text-[10px] text-znz-muted">Alt + V</span>
                </div>

                <div onclick="setLineTool('crossline')" class="menu-item" id="item-crossline">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16M4 12h16"/></svg>
                        Crossline
                    </span>
                    <span class="text-[10px] text-znz-muted">Alt + C</span>
                </div>
            </div>
        </div>

        <!-- Chart Container + SVG Overlay Layer -->
        <div id="chart-container">
            <svg id="drawing-svg-overlay"></svg>
        </div>
    </div>

    <!-- Replay Controller & Render-Loop SVG Engine -->
    <script>
        let chart = null;
        let candlestickSeries = null;
        let fullCandleData = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playInterval = null;
        let playSpeed = 500;
        let activeTool = 'cursor';
        let currentTimeframe = '15m';

        // Stored drawing definitions anchored to chart data (Price / Time)
        let drawings = [];

        // Interactive Placement States
        let firstPoint = null; 
        let previewTarget = null; 
        let isMouseDown = false;

        function initChart() {
            const container = document.getElementById('chart-container');
            
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: {
                    background: { type: 'solid', color: '#050507' },
                    textColor: '#8E95A5',
                },
                grid: {
                    vertLines: { color: 'rgba(255, 255, 255, 0.04)' },
                    horzLines: { color: 'rgba(255, 255, 255, 0.04)' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: 'rgba(255, 255, 255, 0.08)',
                },
                timeScale: {
                    borderColor: 'rgba(255, 255, 255, 0.08)',
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#10B981',
                downColor: '#EF4444',
                borderDownColor: '#EF4444',
                borderUpColor: '#10B981',
                wickDownColor: '#EF4444',
                wickUpColor: '#10B981',
            });

            // Smooth re-render listeners for camera pan, vertical axis scale, and logical index moves
            chart.timeScale().subscribeVisibleTimeRangeChange(() => requestAnimationFrame(renderDrawings));
            chart.timeScale().subscribeVisibleLogicalRangeChange(() => requestAnimationFrame(renderDrawings));

            // Continuously request frame updates during drag interaction to eliminate jitter
            container.addEventListener('mousedown', () => { isMouseDown = true; });
            window.addEventListener('mouseup', () => { isMouseDown = false; });

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const price = candlestickSeries.coordinateToPrice(mouseY);
                const time = chart.timeScale().coordinateToTime(mouseX);

                if (activeTool !== 'cursor') {
                    previewTarget = { x: mouseX, y: mouseY, price, time };
                }

                if (isMouseDown || activeTool !== 'cursor') {
                    requestAnimationFrame(renderDrawings);
                }
            });

            // Click Handler for Placing Drawings
            container.addEventListener('click', (e) => {
                if (activeTool === 'cursor') return;

                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const price = candlestickSeries.coordinateToPrice(mouseY);
                const time = chart.timeScale().coordinateToTime(mouseX);

                if (!price) return;

                if (activeTool === 'hline') {
                    drawings.push({ type: 'hline', price });
                    selectTool('cursor');
                } else if (activeTool === 'vline') {
                    if (!time) return;
                    drawings.push({ type: 'vline', time });
                    selectTool('cursor');
                } else if (activeTool === 'crossline') {
                    if (!time) return;
                    drawings.push({ type: 'hline', price });
                    drawings.push({ type: 'vline', time });
                    selectTool('cursor');
                } else if (activeTool === 'hray') {
                    if (!time) return;
                    drawings.push({ type: 'hray', price, time });
                    selectTool('cursor');
                } else if (['trendline', 'ray', 'extendedline', 'infoline', 'trendangle'].includes(activeTool)) {
                    if (!time) return;

                    if (!firstPoint) {
                        firstPoint = { time, price, x: mouseX, y: mouseY };
                    } else {
                        drawings.push({
                            type: activeTool,
                            time1: firstPoint.time,
                            price1: firstPoint.price,
                            time2: time,
                            price2: price
                        });
                        firstPoint = null;
                        selectTool('cursor');
                    }
                }
                renderDrawings();
            });

            // Automatic Window Resize Handler
            window.addEventListener('resize', () => {
                if (chart && container) {
                    chart.applyOptions({
                        width: container.clientWidth,
                        height: container.clientHeight,
                    });
                    renderDrawings();
                }
            });

            // Hotkey Shortcuts Handler
            window.addEventListener('keydown', (e) => {
                if (e.altKey) {
                    const key = e.key.toLowerCase();
                    if (key === 't') setLineTool('trendline');
                    if (key === 'h') setLineTool('hline');
                    if (key === 'j') setLineTool('hray');
                    if (key === 'v') setLineTool('vline');
                    if (key === 'c') setLineTool('crossline');
                }
            });

            loadCandleData(currentTimeframe);
        }

        function toggleLinesMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('lines-menu');
            menu.classList.toggle('hidden');
        }

        document.addEventListener('click', () => {
            const menu = document.getElementById('lines-menu');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });

        function setLineTool(toolName) {
            selectTool(toolName);
            document.getElementById('lines-menu').classList.add('hidden');
        }

        function selectTool(toolName) {
            activeTool = toolName;
            firstPoint = null;
            previewTarget = null;

            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));

            if (toolName !== 'cursor') {
                document.getElementById('tool-lines-category').classList.add('active');
                const menuItem = document.getElementById(`item-${toolName}`);
                if (menuItem) menuItem.classList.add('active');
            } else {
                document.getElementById('tool-cursor').classList.add('active');
            }

            const svgOverlay = document.getElementById('drawing-svg-overlay');
            if (toolName === 'cursor') {
                svgOverlay.style.pointerEvents = 'none';
            } else {
                svgOverlay.style.pointerEvents = 'auto';
                svgOverlay.style.cursor = 'crosshair';
            }
            renderDrawings();
        }

        function clearDrawings() {
            drawings = [];
            firstPoint = null;
            previewTarget = null;
            selectTool('cursor');
        }

        // Render drawings anchored to Price / Time with vector math slopes (WHITE COLOR FOR VISIBILITY)
        function renderDrawings() {
            const svgOverlay = document.getElementById('drawing-svg-overlay');
            svgOverlay.innerHTML = '';

            if (!candlestickSeries || !chart) return;

            const timeScale = chart.timeScale();
            const width = document.getElementById('chart-container').clientWidth;

            // 1. Render Saved Drawings (WHITE LINES)
            drawings.forEach(d => {
                if (d.type === 'hline') {
                    const y = candlestickSeries.priceToCoordinate(d.price);
                    if (y !== null) {
                        const line = createSvgLine(0, y, width, y, '#FFFFFF', 2, '4');
                        svgOverlay.appendChild(line);
                    }
                } else if (d.type === 'vline') {
                    const x = timeScale.timeToCoordinate(d.time);
                    if (x !== null) {
                        const line = createSvgLine(x, 0, x, '100%', '#FFFFFF', 2, '4');
                        svgOverlay.appendChild(line);
                    }
                } else if (d.type === 'hray') {
                    const x = timeScale.timeToCoordinate(d.time);
                    const y = candlestickSeries.priceToCoordinate(d.price);
                    if (x !== null && y !== null) {
                        const line = createSvgLine(x, y, width, y, '#FFFFFF', 2, '4');
                        svgOverlay.appendChild(line);
                    }
                } else if (['trendline', 'ray', 'extendedline', 'infoline', 'trendangle'].includes(d.type)) {
                    const x1 = timeScale.timeToCoordinate(d.time1);
                    const y1 = candlestickSeries.priceToCoordinate(d.price1);
                    const x2 = timeScale.timeToCoordinate(d.time2);
                    const y2 = candlestickSeries.priceToCoordinate(d.price2);

                    if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                        let renderX1 = x1, renderY1 = y1, renderX2 = x2, renderY2 = y2;

                        const dx = x2 - x1;
                        const dy = y2 - y1;

                        if (d.type === 'ray') {
                            renderX2 = width;
                            renderY2 = dx !== 0 ? y1 + (dy / dx) * (width - x1) : y2;
                        } else if (d.type === 'extendedline') {
                            renderX1 = 0;
                            renderY1 = dx !== 0 ? y1 + (dy / dx) * (0 - x1) : y1;
                            renderX2 = width;
                            renderY2 = dx !== 0 ? y1 + (dy / dx) * (width - x1) : y2;
                        }

                        const line = createSvgLine(renderX1, renderY1, renderX2, renderY2, '#FFFFFF', 2);
                        svgOverlay.appendChild(line);

                        // Endpoint Anchor Circles
                        createSvgCircle(x1, y1, 4, '#FFFFFF', svgOverlay);
                        if (d.type !== 'ray' && d.type !== 'extendedline') {
                            createSvgCircle(x2, y2, 4, '#FFFFFF', svgOverlay);
                        }

                        // Info Line & Trend Angle Badges
                        if (d.type === 'infoline') {
                            const pDiff = (d.price2 - d.price1).toFixed(2);
                            const pPct = (((d.price2 - d.price1) / d.price1) * 100).toFixed(2);
                            const text = createSvgText((x1 + x2) / 2, (y1 + y2) / 2 - 10, `${pDiff} (${pPct}%)`);
                            svgOverlay.appendChild(text);
                        } else if (d.type === 'trendangle') {
                            const angle = Math.round(Math.atan2(-dy, dx) * (180 / Math.PI));
                            const text = createSvgText(x2 + 10, y2, `${angle}°`);
                            svgOverlay.appendChild(text);
                        }
                    }
                }
            });

            // 2. Render Live Rubber-Band Guide Previews (WHITE GUIDES)
            if (previewTarget && activeTool !== 'cursor') {
                const y = previewTarget.y;
                const x = previewTarget.x;

                if (activeTool === 'hline') {
                    const line = createSvgLine(0, y, width, y, '#FFFFFF', 1.5, '3', '0.7');
                    svgOverlay.appendChild(line);
                } else if (activeTool === 'vline') {
                    const line = createSvgLine(x, 0, x, '100%', '#FFFFFF', 1.5, '3', '0.7');
                    svgOverlay.appendChild(line);
                } else if (firstPoint) {
                    const x1 = timeScale.timeToCoordinate(firstPoint.time);
                    const y1 = candlestickSeries.priceToCoordinate(firstPoint.price);

                    if (x1 !== null && y1 !== null) {
                        const line = createSvgLine(x1, y1, x, y, '#FFFFFF', 2, '4', '0.8');
                        svgOverlay.appendChild(line);
                        createSvgCircle(x1, y1, 4, '#FFFFFF', svgOverlay);
                    }
                }
            }
        }

        // SVG Element Creation Helpers
        function createSvgLine(x1, y1, x2, y2, color = '#FFFFFF', strokeWidth = 2, dash = '', opacity = '1') {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', strokeWidth);
            if (dash) line.setAttribute('stroke-dasharray', dash);
            line.setAttribute('opacity', opacity);
            return line;
        }

        function createSvgCircle(cx, cy, r, color = '#FFFFFF', parent) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', cx);
            circle.setAttribute('cy', cy);
            circle.setAttribute('r', r);
            circle.setAttribute('fill', color);
            parent.appendChild(circle);
        }

        function createSvgText(x, y, str) {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', x);
            text.setAttribute('y', y);
            text.setAttribute('fill', '#FFFFFF');
            text.setAttribute('font-size', '11');
            text.setAttribute('font-weight', 'bold');
            text.setAttribute('text-anchor', 'middle');
            text.textContent = str;
            return text;
        }

        function changeTimeframe(tf) {
            currentTimeframe = tf;
            document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
            
            const tfMap = {
                '1m': 'tf-1m', '5m': 'tf-5m', '15m': 'tf-15m', 
                '1h': 'tf-1h', '4h': 'tf-4h', '1d': 'tf-1D', 
                '1w': 'tf-1W', '1M': 'tf-1M'
            };
            if (tfMap[tf]) document.getElementById(tfMap[tf]).classList.add('active');

            pause();
            loadCandleData(tf);
        }

        async function loadCandleData(interval) {
            const apiIntervalMap = {
                '1m': '1m', '5m': '5m', '15m': '15m',
                '1h': '1h', '4h': '4h', '1d': '1d',
                '1w': '1w', '1M': '1m'
            };

            try {
                const apiTf = apiIntervalMap[interval] || '15m';
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=${apiTf}&limit=1000`);
                if (response.ok) {
                    const rawData = await response.json();
                    fullCandleData = rawData.map(d => ({
                        time: Math.floor(d[0] / 1000),
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));
                } else {
                    throw new Error("Binance API offline, generating data.");
                }
            } catch (err) {
                console.warn(err.message);
                generateFallbackCandles();
            }

            currentIndex = Math.min(700, fullCandleData.length - 1);
            updateChartState();

            if (fullCandleData[currentIndex]) {
                const cutDate = new Date(fullCandleData[currentIndex].time * 1000).toISOString().split('T')[0];
                document.getElementById('replay-date').value = cutDate;
            }
        }

        function generateFallbackCandles() {
            fullCandleData = [];
            let baseTime = Math.floor(Date.now() / 1000) - (1000 * 900);
            let currentPrice = 4096.15;

            for (let i = 0; i < 1000; i++) {
                let change = (Math.random() - 0.49) * 6.5;
                let open = currentPrice;
                let close = open + change;
                let high = Math.max(open, close) + Math.random() * 2.5;
                let low = Math.min(open, close) - Math.random() * 2.5;

                fullCandleData.push({
                    time: baseTime + (i * 900),
                    open: parseFloat(open.toFixed(2)),
                    high: parseFloat(high.toFixed(2)),
                    low: parseFloat(low.toFixed(2)),
                    close: parseFloat(close.toFixed(2)),
                });

                currentPrice = close;
            }
        }

        function updateChartState() {
            if (!candlestickSeries || fullCandleData.length === 0) return;

            const slicedData = fullCandleData.slice(0, currentIndex + 1);
            candlestickSeries.setData(slicedData);

            const lastCandle = fullCandleData[currentIndex];
            if (lastCandle) {
                document.getElementById('replay-price').innerText = `$${lastCandle.close.toFixed(2)}`;
                const timeStr = new Date(lastCandle.time * 1000).toLocaleString('en-US', { timeZone: 'Asia/Jakarta' });
                document.getElementById('candle-time-display').innerText = `Bar Date: ${timeStr} WIB`;
            }

            chart.timeScale().fitContent();
            renderDrawings();
        }

        function jumpToCutDate() {
            pause();
            const selectedDate = document.getElementById('replay-date').value;
            if (!selectedDate) return;

            const targetTimestamp = Math.floor(new Date(selectedDate).getTime() / 1000);
            const foundIndex = fullCandleData.findIndex(c => c.time >= targetTimestamp);

            if (foundIndex !== -1) {
                currentIndex = foundIndex;
                updateChartState();
            } else {
                alert('Selected date is outside the loaded range.');
            }
        }

        function stepForward() {
            if (currentIndex < fullCandleData.length - 1) {
                currentIndex++;
                const nextBar = fullCandleData[currentIndex];
                candlestickSeries.update(nextBar);

                document.getElementById('replay-price').innerText = `$${nextBar.close.toFixed(2)}`;
                const timeStr = new Date(nextBar.time * 1000).toLocaleString('en-US', { timeZone: 'Asia/Jakarta' });
                document.getElementById('candle-time-display').innerText = `Bar Date: ${timeStr} WIB`;

                renderDrawings();
            } else {
                pause();
            }
        }

        function togglePlay() {
            if (isPlaying) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            isPlaying = true;
            document.getElementById('btn-play').innerHTML = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            playInterval = setInterval(stepForward, playSpeed);
        }

        function pause() {
            isPlaying = false;
            document.getElementById('btn-play').innerHTML = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            if (playInterval) clearInterval(playInterval);
        }

        function changeSpeed() {
            playSpeed = parseInt(document.getElementById('replay-speed').value);
            if (isPlaying) {
                pause();
                play();
            }
        }

        window.addEventListener('DOMContentLoaded', initChart);
    </script>
</body>
</html>
